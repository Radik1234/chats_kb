services:
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.8.0}
    container_name: onec-kb-opensearch
    environment:
      - discovery.type=single-node
      - cluster.name=onec-kb
      - node.name=opensearch
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 6g
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - onec-kb
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sk -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION:-3.8.0}
    container_name: onec-kb-dashboards
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      OPENSEARCH_SSL_VERIFICATIONMODE: none
      SERVER_HOST: 0.0.0.0
      SERVER_NAME: onec-kb-dashboards
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - onec-kb
    depends_on:
      opensearch:
        condition: service_healthy
    mem_limit: 1g
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:5601/app/login >/dev/null || exit 1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  mcp:
    profiles: ["mcp"]
    build:
      context: ./services/mcp
    image: onec-kb-mcp:local
    container_name: onec-kb-mcp
    environment:
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      OPENSEARCH_SSL_VERIFY: "false"
    command:
      - python
      - -m
      - mcp_server_opensearch
      - --transport
      - stream
      - --host
      - 0.0.0.0
      - --port
      - "9900"
    ports:
      - "127.0.0.1:${MCP_PORT:-9900}:9900"
    networks:
      - onec-kb
    depends_on:
      opensearch:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; s=socket.create_connection(('127.0.0.1',9900),2); s.close()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ingest:
    build:
      context: ./services/import
    image: onec-kb-ingest:local
    container_name: onec-kb-ingest
    environment:
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      OPENSEARCH_SSL_VERIFY: "false"
      OPENSEARCH_MAX_SHARDS_PER_NODE: ${OPENSEARCH_MAX_SHARDS_PER_NODE:-1000}
      INGEST_ROOT: /data/telegram
      INGEST_CHUNK_INTERVAL_SEC: ${INGEST_CHUNK_INTERVAL_SEC:-10}
      INGEST_POLL_INTERVAL_SEC: ${INGEST_POLL_INTERVAL_SEC:-30}
      INGEST_STABLE_SEC: ${INGEST_STABLE_SEC:-5}
      INGEST_SKIP_SERVICE: ${INGEST_SKIP_SERVICE:-true}
      INGEST_SKIP_EMPTY: ${INGEST_SKIP_EMPTY:-true}
    volumes:
      - ./data/telegram:/data/telegram
    networks:
      - onec-kb
    depends_on:
      opensearch:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  import:
    profiles: ["import"]
    image: onec-kb-ingest:local
    environment:
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      OPENSEARCH_SSL_VERIFY: "false"
      OPENSEARCH_MAX_SHARDS_PER_NODE: ${OPENSEARCH_MAX_SHARDS_PER_NODE:-1000}
      INGEST_CHUNK_INTERVAL_SEC: ${INGEST_CHUNK_INTERVAL_SEC:-10}
      INGEST_SKIP_SERVICE: ${INGEST_SKIP_SERVICE:-true}
      INGEST_SKIP_EMPTY: ${INGEST_SKIP_EMPTY:-true}
    volumes:
      - ./data/telegram:/data/telegram
      - ./chats_history:/data/chats_history:ro
    networks:
      - onec-kb
    depends_on:
      opensearch:
        condition: service_healthy
    entrypoint: ["python", "-u", "/app/import_telegram.py"]

  importer:
    profiles: ["backfill"]
    build:
      context: ./services
      dockerfile: importer/Dockerfile
    image: onec-kb-importer:local
    container_name: onec-kb-importer
    environment:
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      OPENSEARCH_SSL_VERIFY: "false"
      INGEST_ROOT: /data/telegram
      BACKFILL_DAYS_PER_RUN: ${BACKFILL_DAYS_PER_RUN:-7}
      BACKFILL_INTERVAL_SEC: ${BACKFILL_INTERVAL_SEC:-300}
      BACKFILL_MIN_RECHECK_SEC: ${BACKFILL_MIN_RECHECK_SEC:-3600}
      BACKFILL_GUARD_INBOX: ${BACKFILL_GUARD_INBOX:-true}
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_SESSION: ${TG_SESSION:-}
    volumes:
      - ./data/telegram:/data/telegram
    networks:
      - onec-kb
    depends_on:
      opensearch:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

volumes:
  opensearch-data:

networks:
  onec-kb:
    name: onec-kb
