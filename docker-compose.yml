name: onec-kb

x-atlas-environment: &atlas-environment
  BEEVER_ENV: production
  BEEVER_API_URL: ${BEEVER_PUBLIC_URL:-https://atlas.localhost}
  CORS_ORIGINS: ${BEEVER_PUBLIC_URL:-https://atlas.localhost}
  WEAVIATE_URL: http://weaviate:8080
  WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:?Run scripts/bootstrap.ps1 first}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run scripts/bootstrap.ps1 first}
  MONGODB_URI: mongodb://mongodb:27017/beever_atlas
  REDIS_URL: redis://redis:6379
  LLM_CHAT_BASE_URL: http://llama-chat:8080/v1
  LLM_EMBEDDING_BASE_URL: http://llama-embedding:8080/v1

services:
  atlas:
    image: onec-kb-atlas:v0.2.0-local
    build:
      context: ./vendor/beever-atlas
    restart: unless-stopped
    mem_limit: ${ATLAS_API_MEM_LIMIT:-4g}
    memswap_limit: ${ATLAS_API_MEMSWAP_LIMIT:-6g}
    env_file: ${ATLAS_ENV_FILE:-.env}
    environment:
      <<: *atlas-environment
    depends_on:
      weaviate:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - atlas_imports:/app/.omc/imports
    networks:
      default:
        aliases:
          - beever-atlas
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  atlas-config:
    image: onec-kb-atlas:v0.2.0-local
    restart: "no"
    env_file: ${ATLAS_ENV_FILE:-.env}
    environment:
      <<: *atlas-environment
    depends_on:
      atlas:
        condition: service_healthy
    volumes:
      - ./atlas.yaml:/config/atlas.yaml:ro
      # v0.2.0 deliberately omits this CLI-only module from its runtime image.
      - ./vendor/beever-atlas/scripts/atlas_apply.py:/app/scripts/atlas_apply.py:ro
    command: ["python", "-m", "scripts.atlas_apply", "apply", "--config", "/config/atlas.yaml"]

  web:
    image: onec-kb-atlas-web:v0.2.0-local
    build:
      context: ./vendor/beever-atlas/web
      args:
        VITE_API_URL: ${BEEVER_PUBLIC_URL:-https://atlas.localhost}
        VITE_BEEVER_API_KEY: ${BEEVER_API_KEYS:?Run scripts/bootstrap.ps1 first}
        VITE_BEEVER_ADMIN_TOKEN: ${BEEVER_ADMIN_TOKEN:?Run scripts/bootstrap.ps1 first}
    restart: unless-stopped
    depends_on:
      atlas:
        condition: service_healthy
    expose:
      - "8080"

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.0@sha256:58b576d36eace6a33f1a0866b9fd13fd58abfb9ce1eaaa419758c70b6a427e36
    restart: unless-stopped
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:?Run scripts/bootstrap.ps1 first}
      AUTHENTICATION_APIKEY_USERS: admin@beever.local
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community@sha256:f66304b9511c60d33555a2c451f88e03d82d1ebc893f32d84c98a6b326096435
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run scripts/bootstrap.ps1 first}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0@sha256:43fddee7e532a920f3dfdee9e8f4834398c155c26bcb92d790cc1cd3c630fc40
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  llama-chat:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:c86fa61ea944d5a68a27d83233419965f3db31ffb688e202bbbfd5b8958a4b98}
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
    command:
      - --model
      - /models/${LLM_MODEL_FILE:-Qwen2.5-14B-Instruct-Q4_K_M.gguf}
      - --alias
      - ${LLM_MODEL_ID:-qwen2.5-14b-instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${LLM_CONTEXT_SIZE:-16384}
      - --parallel
      - ${LLM_PARALLEL:-1}
      - --n-gpu-layers
      - ${LLM_GPU_LAYERS:-99}
      - --jinja
    expose:
      - "8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llama-embedding:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:c86fa61ea944d5a68a27d83233419965f3db31ffb688e202bbbfd5b8958a4b98}
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
    command:
      - --model
      - /models/${EMBEDDING_MODEL_FILE:-bge-m3-Q8_0.gguf}
      - --alias
      - ${EMBEDDING_MODEL_ID:-bge-m3}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${EMBEDDING_CONTEXT_SIZE:-8192}
      - --batch-size
      - ${EMBEDDING_BATCH_SIZE:-512}
      - --ubatch-size
      - ${EMBEDDING_UBATCH_SIZE:-512}
      - --n-gpu-layers
      - ${EMBEDDING_GPU_LAYERS:-99}
      - --embedding
      - --pooling
      - mean
    expose:
      - "8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      atlas:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  atlas_imports:
  weaviate_data:
  neo4j_data:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:
